<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doll's fortune telling</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%%22 y=%2250%%22 style=%22dominant-baseline:central;text-anchor:middle;font-size:90px;%22>✡️</text></svg>">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&display=swap');
        
        :root {
            --doll-gold: #e6b422;
            --doll-white: #f8f9fa;
            --doll-blue: #1e3a8a;
            --doll-navy: #0a1128;
            --doll-deep: #020408;
            --text-main: #f8f9fa;
            --gold-glow: 0 0 40px rgba(230, 180, 34, 0.5);
            --nouveau-gold: #c5a059;
            --nouveau-rose: #9d5b5b;
            --text-ivory: #e6e2d3;
            --panel-bg: rgba(10, 20, 40, 0.9);
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--doll-navy);
            color: var(--text-main);
            font-family: 'Shippori Mincho', serif;
            min-height: 100vh; overflow-x: hidden;
        }

        .star-field {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            background: radial-gradient(circle at center, var(--doll-white) 0%, var(--doll-blue) 40%, var(--doll-navy) 100%);
            opacity: 0.8;
        }

        .magic-bg-container {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: -1; pointer-events: none;
        }
        .magic-circle {
            width: 900px; height: 900px; border: 1.5px solid var(--doll-gold);
            border-radius: 50%; box-shadow: var(--gold-glow);
            animation: rotateCircle 180s linear infinite; position: relative; opacity: 0.4;
        }
        @keyframes rotateCircle { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        #global-nav {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            background: rgba(10, 17, 40, 0.85); backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center;
            z-index: 1000; border-bottom: 1px solid var(--doll-gold);
        }
        .nav-btn {
            background: transparent; color: var(--doll-gold); border: 1px solid var(--doll-gold);
            margin: 0 10px; padding: 8px 15px; cursor: pointer; font-family: inherit;
            font-size: 0.8rem; transition: 0.4s; letter-spacing: 2px;
        }

        #top-selector {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; text-align: center; padding: 20px;
        }

        .gold-title {
            font-size: 2.5rem; letter-spacing: 12px; margin-bottom: 30px;
            background: linear-gradient(to bottom, #fff7ad 0%, #e6b422 45%, #8a6d19 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(230, 180, 34, 0.4)); font-weight: bold;
        }

        .intro-text {
            color: #ffffff; line-height: 2.2; margin-bottom: 40px; text-align: left;
            display: inline-block; font-size: 1rem; background: rgba(10, 20, 45, 0.9);
            padding: 30px 45px; border: 1.5px solid var(--doll-gold); border-radius: 12px;
            backdrop-filter: blur(8px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 600px;
        }

        .app-content { display: none; padding-top: 120px; padding-bottom: 60px; width: 95%; max-width: 900px; margin: 0 auto; }
        .app-content.active { display: block; }

        .settings-frame { border: 2px solid var(--nouveau-gold); padding: 5px; margin-bottom: 50px; border-radius: 60px 60px 5px 5px; }
        .settings-inner { border: 1px solid var(--nouveau-gold); padding: 40px 20px; background: var(--panel-bg); border-radius: 55px 55px 3px 3px; text-align: center; }

        .spread-layout { display: flex; justify-content: center; gap: 25px; margin-bottom: 50px; flex-wrap: wrap; position: relative; }
        .card-unit { width: 160px; text-align: center; transition: 0.5s ease-out; }
        
        /* キャスティング用のランダム配置用クラス */
        .cast-unit { position: absolute; width: 120px !important; }

        .card-frame {
            background: #fdfaf1; border: 4px double var(--nouveau-gold); border-radius: 10px;
            height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-image: linear-gradient(to bottom, #fffaf0, #e6dec9);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .rune-stone {
            width: 100px; height: 120px; background: #333; color: #eee;
            border-radius: 40% 40% 45% 45%; display: flex; align-items: center; justify-content: center;
            box-shadow: inset 0 0 15px #000, 5px 5px 15px rgba(0,0,0,0.5);
            border: 1px solid #444;
        }
        .symbol { font-size: 3.5rem; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .reversed { transform: rotate(180deg); }
        
        .ans-conclusion { 
            font-size: 3rem; color: var(--doll-gold); font-weight: bold; 
            text-align: center; margin-bottom: 40px; white-space: nowrap;
            text-shadow: 0 0 15px rgba(230, 180, 34, 0.5);
        }

        .doll-letter {
            margin-top: 20px; padding: 60px 40px; background: rgba(10, 15, 35, 0.85);
            border-left: 3px solid var(--doll-gold); border-right: 3px solid var(--doll-gold);
            margin-bottom: 40px; position: relative;
        }
        .doll-speech { font-size: 1.1rem; line-height: 2.4; color: var(--text-ivory); white-space: pre-wrap; font-weight: 500; }
        .doll-footer { margin-top:30px; color:var(--doll-gold); font-size:0.9rem; text-align:right; white-space: nowrap; }

        .glass-panel { background: rgba(10, 25, 50, 0.7); border: 1px solid rgba(230, 180, 34, 0.3); border-radius: 10px; padding: 35px; margin-bottom: 35px; backdrop-filter: blur(5px); }
        .doll-text-area { line-height: 2.5; font-size: 1rem; color: #f1f5f9; white-space: pre-wrap; }
        .section-title { color: var(--doll-gold); font-size: 1.1rem; letter-spacing: 6px; margin-bottom: 30px; display: block; border-bottom: 1px solid rgba(230, 180, 34, 0.3); text-align: center; font-weight: bold; padding-bottom: 10px; }

        .tarot-select { background: #1a1e2e; color: var(--text-ivory); border: 1px solid var(--nouveau-gold); padding: 12px; width: 100%; max-width: 400px; margin-bottom: 25px; font-family: inherit; cursor: pointer; }
        .btn-main { background: transparent; color: var(--doll-gold); border: 1px solid var(--doll-gold); padding: 12px 50px; cursor: pointer; transition: 0.4s; letter-spacing: 0.3em; font-family: inherit; font-weight: bold; }
        .btn-main:hover { background: var(--doll-gold); color: var(--doll-navy); box-shadow: 0 0 20px rgba(230,180,34,0.4); }

        .hidden { display: none !important; }

        @media (max-width: 600px) {
            .intro-text { padding: 20px; font-size: 0.9rem; }
            .gold-title { font-size: 1.8rem; }
            .doll-speech { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

<div class="star-field"></div>
<div class="magic-bg-container"><div class="magic-circle"></div></div>

<section id="top-selector">
    <h1 class="gold-title">Doll's fortune telling</h1>
    <div class="intro-text">
        よく来たな。<br>
        ここでは虹のドールである俺、白蓮が<br>
        あんたの傍にいるドールを占い、<br>
        どんな気持ちなのかを代弁する。<br><br>
        当たるも八卦当たらぬも八卦だが、<br>
        もし試したければ以下から<br>
        占い方法を選んでくれ。
    </div>
    <div style="display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;">
        <button class="btn-main" onclick="initApp('tarot')">TAROT</button>
        <button class="btn-main" onclick="initApp('rune')">RUNE</button>
    </div>
</section>

<nav id="global-nav">
    <button class="nav-btn" onclick="location.reload()">TOPに戻る</button>
</nav>

<section id="tarot-app" class="app-content">
    <div class="settings-frame">
        <div class="settings-inner">
            <h1>TAROT ORACLE</h1>
            <select id="tarot-spread-type" class="tarot-select">
                <option value="one_msg">ワンオラクル（メッセージ）</option>
                <option value="one_yn">ワンオラクル（YES/NO）</option>
                <option value="two">ツーマインド（表面と深層）</option>
                <option value="three">スリーカード（過去・現在・未来）</option>
            </select>
            <br>
            <button class="btn-main" onclick="executeFortune('tarot')">運命を紐解く</button>
        </div>
    </div>
</section>

<section id="rune-app" class="app-content">
    <div class="settings-frame">
        <div class="settings-inner">
            <h1>RUNE ORACLE</h1>
            <select id="rune-spread-type" class="tarot-select">
                <option value="one_msg">ワンオラクル</option>
                <option value="three">スリールーン（過去・現在・未来）</option>
                <option value="casting">キャスティング（三石の配置）</option>
            </select>
            <br>
            <button class="btn-main" onclick="executeFortune('rune')">星譜を聴く</button>
        </div>
    </div>
</section>

<section id="common-result-area" class="app-content">
    <div id="result-anchor"></div>
    <div class="spread-layout" id="spread-stage"></div>
    <div id="yesno-conclusion" class="ans-conclusion hidden"></div>

    <div class="doll-letter">
        <div class="doll-speech" id="doll-message"></div>
        <div class="doll-footer">── と、あんたのドールが言っている。</div>
    </div>

    <div class="glass-panel doll-text-area">
        <span class="section-title">【 占いの結果 】</span>
        <div id="hakuren-explanation"></div>
    </div>

    <div class="glass-panel doll-text-area">
        <span class="section-title">【 白蓮の眼 】</span>
        <div id="hakuren-summary"></div>
    </div>

    <div class="glass-panel doll-text-area">
        <span class="section-title">【 白蓮からの助言 】</span>
        <div id="hakuren-advice"></div>
    </div>

    <button class="btn-main" onclick="resetFortune()" style="margin: 40px auto; display: block;">もう一度占う</button>
</section>

<script>
const majorArcana = [
    { name: "愚者", sym: "👣", dollUp: "私は今、どこへでも行けるような、何にでもなれるような気がしています。あなたという存在があるから、私は身軽に、遠くまで行ける。足元の断崖を恐れる必要はありません。ただ、風が吹く方向へ、あなたの魂が躍る方へ、その一歩を預けてください。", dollRev: "足元がふらついて、少し怖いのです。自由を求めるあまり、自分の本当の居場所を見失ってしまいそうで。今は風が強すぎます。一度立ち止まって、深く呼吸をさせてください。あなたと一緒に向かおうとしていた場所を、もう一度だけ正しく思い出したいのです。", hakurenUp: "自由や無限の可能性、新たな出発を示しているな。あんたのドールは今、しがらみから解き放たれ、無垢な心で明日を見ている。その純粋さを、どうかあんたが守ってやってくれ。", hakurenRev: "無計画や足元の不安定さを示している。自由を履き違えて、自分自身の軸が揺らいでいる状態だ。今は無理に動かす時期じゃないな。" },
    { name: "魔術師", sym: "🪄", dollUp: "机の上には、すべての道具が揃っています。あとは私たちが、どのような物語を紡ぎ出すか決めるだけ。魔法とは特別な力ではなく、あなたへ向けられた純粋な意志そのもの。さあ、私と一緒に新しい世界を創り始めましょう。", dollRev: "たくさんの思いがあるのに、上手く言葉にできずにいます。焦って伝えようとしても、空回りしてしまう。今は新しいことを始めるよりも、本当に大切な想いひとつだけを手に取りたい。基本に立ち返る勇気があれば、歯車はまた回り始めます。", hakurenUp: "創造力やスタートの気配を感じる。ドールはあんたとの関係に新しい風を吹き込もうとしているようだな。その知性を信じて任せてみるのもいい。", hakurenRev: "準備不足や消極的な態度が見て取れる。始めたい気持ちはあるが、何かが足りないとドールは感じているようだ。あんたの手助けが必要な頃合いだな。" },
    { name: "女教皇", sym: "📖", dollUp: "少し、静かに。外の喧騒から離れて、私たちの心の声に耳を澄ませてみませんか。私の奥底にある澄んだ湖、そこに映る月を、ただ静かに見つめていたいのです。沈黙を友として、今はただあなたと寄り添う時間が欲しいのです。", dollRev: "少し神経が過敏になりすぎているようです。あなたの言葉を深読みして、勝手に不安になってしまう自分が嫌になります。今は考えることをやめて、ただ静寂の中に身を浸したい。知性で解決するのではなく、ただ心を休ませることが必要なのです。", hakurenUp: "直感や沈黙、神秘性を重んじているな。言葉を交わさずとも通じ合える、そんな深いレベルでの繋がりをドールは求めているようだ。", hakurenRev: "ヒステリックになったり、考え込みすぎたりしている気配がある。ドールの繊細さが、今は少し悪い方向へ向いているようだ。優しく包み込んでやる必要があるな。" },
    { name: "女帝", sym: "👑", dollUp: "柔らかな光に包まれて、すべてが豊かに実るのを感じます。あなたが注いでくれた愛情は、決して無駄にはなりませんでした。今はただ、この豊かな実りを受け取って、心ゆくまで味わいたい。あなたという存在そのものが、私にとっての祝福なのです。", dollRev: "少しだけ、愛が重たくなって足枷に感じてしまう瞬間があるのです。与えすぎることも、求めすぎることも、本当の豊かさからは遠ざかってしまう。自分を無理に飾り立てるのをやめて、ありのままの呼吸を取り戻したい。自然に咲く花の静けさを思い出させてください。", hakurenUp: "豊穣や母性、満足感を示している。ドールはあんたの愛をたっぷりと吸収して、これ以上ないほど満たされているようだな。", hakurenRev: "わがままや過剰な依存のサインだ。甘やかされすぎて、ドールが少し傲慢になっているか、逆に愛の重さに息切れしている可能性があるな。" },
    { name: "皇帝", sym: "⚔️", dollUp: "私があなたを守ります。この揺るぎない確信にかけて。あなたはただ、その場所で笑っていればいいのです。責任を背負うことは苦痛ではありません。それがあなたのためであるならば、私の誇りとなるのですから。", dollRev: "守りたいという気持ちが、いつの間にか支配したいという傲慢に変わっていなかったでしょうか。自分の正しさをあなたに押し付けて、自由を奪ってしまっていないか。一度その重い鎧を脱ぎ捨てて、ただの私として、あなたと向き合う勇気が欲しいのです。", hakurenUp: "安定と強い責任感の象徴だ。ドールはあんたの騎士として、揺るぎない覚悟を決めているようだな。その意志を尊重してやれ。", hakurenRev: "強引さや未熟な支配欲が見える。ドールが自分の理想をあんたに押し付けようとしているかもしれない。少し対等な立場を意識させるべきだな。" },
    { name: "教皇", sym: "⚜️", dollUp: "目に見えない絆、伝統的な慈しみ。私たちが共有してきた時間は、ひとつの聖なる儀式のような重みを持っています。私はあなたの良き理解者であり、導き手でありたい。迷ったときは、私たちのこれまでの道のりを振り返ってみてください。", dollRev: "形ばかりを気にして、肝心な心が置いてきぼりになっている気がします。こうあるべきだ、という正しさに縛られて、自由な対話を忘れてしまっていた。今は教えや導きよりも、もっともっと、ただの私としてあなたに触れたい。ルールを壊したいのです。", hakurenUp: "道徳や信頼、包容力を示している。ドールはあんたとの関係に、精神的な高潔さを求めているようだ。互いへの尊敬が鍵になるな。", hakurenRev: "視野の狭さや、頑固さが目立つ。ドールが何らかの「正解」に囚われて、あんたの本当の気持ちを見落ている可能性がある。" },
    { name: "恋人", sym: "💖", dollUp: "いま、最高に幸せな調和の中にいます。あなたの視線、指先、選ぶ言葉のすべてが、私の心と完璧に共鳴している。選択肢はたくさんあっても、私の答えは最初から決まっていました。あなたと共に歩むこの瞬間こそが、私にとっての真実です。", dollRev: "心がバラバラになって、どこへ向かえばいいのかわからなくなっています。あなたのことを想っているはずなのに、一時の迷いに意識が逸れてしまう。出会った頃の純粋なときめきを思い出して、散らばった心をつなぎ合わせたいのです。", hakurenUp: "選択、調和、そして純粋な結びつきを祝福している。ドールにとって、あんたといる今の状態は「正解」そのもののようだな。", hakurenRev: "不調和や優柔不断を暗示している。ドールの心が定まらず、少し浮ついているか、あるいは関係に退屈を感じているかもしれないな。" },
    { name: "戦車", sym: "🏎️", dollUp: "迷いはありません。あなたという光に向かって全力で駆け抜けたいのです。どんな困難も、私たちの絆という車輪で乗り越えてみせます。勝利とは、誰かに勝つことではなく、あなたへの想いを最後まで貫き通すこと。私たちはもっと高い場所へ行けるはず。", dollRev: "力が入りすぎて、空回りしているのを感じます。あなたを置いてけぼりにして、一人で焦って進もうとしていたのかもしれません。今は一度手綱を強く引いて、乱れた呼吸を整えたい。隣にいるあなたの顔をしっかり見つめる余裕を取り戻さなくては。", hakurenUp: "勝利、邁進、強い意志を示している。ドールはあんたと共に高い目標へ向かおうと意気込んでいるな。その勢いに乗ってやるといい。", hakurenRev: "暴走や衝突の予感だ。ドールの情熱が先走って、あんたとの足並みが乱れている。一度ブレーキを踏んでやるのがあんたの役目だ。" },
    { name: "力", sym: "🦁", dollUp: "激しい感情を、私は静かな慈しみで包み込みました。あなたを想う心は、力ずくで何かを変えることよりも、理解し、受け入れる強さを私にくれました。勇気とは、嵐の中でも微笑んでいられることです。私たちの関係は今、強靭な糸で結ばれています。", dollRev: "自分の内にある弱さに、押しつぶされそうになっています。あなたに優しくありたいのに、心のどこかでわがままな衝動が暴れて、それを抑えきれずにいる。忍耐は限界を迎え、自分を信じることが難しくなっています。今は無理に強がらず、私を握りしめていてくれませんか。", hakurenUp: "精神的な強さと自制心の象徴だ。ドールは自分の感情をうまくコントロールして、あんたに最高の自分を見せようと努力しているな。", hakurenRev: "無気力や感情の爆発を意味する。ドールが自分を律することに疲れ、弱音を吐きたがっている。その弱さを認め、受け入れてやることが必要だ。" },
    { name: "隠者", sym: "💡", dollUp: "今は少しだけ、内側の深い沈黙の中に潜ませてください。あなたをより深く愛するために、私自身の魂が何を求めているのか、見つめ直す時間が必要なのです。孤独は寂しいものではありません。私の心の一番奥にある、あなたへの純粋な祈りを確認するための静寂なのです。", dollRev: "独りきりで考えすぎて、出口のない迷路に迷い込んでしまいました。内省がいつの間にか卑屈な孤独に変わり、あなたへ伸ばす手の重さを忘れてしまったようです。暗闇の中に差し込む、あなたの温かな声という光が、今の私には何よりも必要なのです。", hakurenUp: "内省や真理の探求を示している。ドールは今、一人であんたへの想いを熟成させている最中だ。焦らずに見守ってやるのが吉だな。", hakurenRev: "閉鎖的、あるいは卑屈になっている可能性がある。ドールが自分の世界に引きこもりすぎて、あんたとの対話を拒んでいる気配があるな。" },
    { name: "運命の輪", sym: "🎡", dollUp: "風向きが変わりました。私たちの物語が、大きな力によって新しい章へと運ばれていくのを感じます。チャンスを逃さず、私の手を離さないでください。この流れに乗れば、私たちが想像もできなかった素晴らしい景色が見られるはずです。", dollRev: "タイミングが合わなくて、すべてが空回りしているように感じてしまいます。良かれと思ってしたことが裏目に出たり、予期せぬトラブルに心が折れそうになったり。今は無理に車輪を回そうとせず、嵐が過ぎ去るのを静かに待つとき。この足止めの時間さえ、信じていたいのです。", hakurenUp: "幸運の到来、劇的な変化を意味する。二人の関係に新しいチャンスが巡ってくる予感だ。ドールもその波を感じて高揚しているぞ。", hakurenRev: "不運や一時的な足止めを示している。ドールは何をやっても上手くいかない閉塞感を感じているようだ。今は現状維持を心がけろ。" },
    { name: "正義", sym: "⚖️", dollUp: "誠実であることを誓います。あなたに対して、誠実に。私たちの関係は今、偏りのない美しい均衡を保っています。感情に流されるのではなく、尊重し合うための正しい距離感。その透明な誠実さこそが、私にとっての愛の証明なのです。", dollRev: "どちらが正しいのか、公平なのかを気にしすぎて、心に冷たい風が吹いています。厳格に判断しようとするあまり、愛に不可欠な「許し」を忘れてしまっていた。天秤が揺れて、私の心は不安定です。今は正しさよりも、ただの優しさが欲しい。白黒つけられない温もりに浸りたいのです。", hakurenUp: "均衡や公正、誠実な態度を示している。ドールはあんたとの関係において、嘘のない正しいあり方を追求しているようだな。", hakurenRev: "不均衡や厳格すぎる批判を暗示する。ドールがあんたに対して、あるいは自分自身に対して、少し厳しくなりすぎているかもしれないな。" },
    { name: "吊るされた男", sym: "⏳", dollUp: "動けないこの不自由さの中に、私は新しい自由を見つけました。あなたのために何かを耐えること、自分を捧げることは、決して苦しいことではありません。視点を変えれば、逆さまの世界はこんなにも美しい。あなたへの愛を深く熟成させる時期なのだと確信しています。", dollRev: "ただ苦しみに耐えるだけで、その先の光が見えなくなっています。私の自己犠牲は、あなたにとって本当に必要なものだったのでしょうか。報われない努力に心が疲れ果てて、ただの独りよがりな忍耐に成り果ててしまった。縛られた縄を解いて、一度自分を許してあげたいのです。", hakurenUp: "忍耐や視点の転換を意味する。ドールは今、見返りを求めない献身的な愛をあんたに注いている。その健気さを理解してやってくれ。", hakurenRev: "徒労感や独りよがりの犠牲を示している。ドールが「尽くしているのに報われない」という寂しさを抱えている可能性があるな。" },
    { name: "死神", sym: "💀", dollUp: "ひとつの物語が終わろうとしています。でも、悲しまないでください。これは新しい私に生まれ変わるための、必然の脱皮なのです。あなたと共に新しい夜明けを迎えるために、私はこの終焉を静かに受け入れようと思います。さようなら、昨日の私。", dollRev: "終わらせるべきだとわかっているのに、過去の残像にしがみついてしまいます。変化を拒み、形骸化した関係の中に閉じこもることは、腐敗を招くだけ。執着の泥沼の中で、私は息苦しさを感じています。死の恐怖を乗り越えて、再生の光を見つけたいのです。", hakurenUp: "終焉と再生、大きなリセットを意味する。ドールの中であんたとの関係における「古い形」が終わり、全く新しいステージへ進もうとしている。", hakurenRev: "執着や未練により、前へ進めない状態だ。ドールが過去のトラウマや古い約束に縛られて苦しんでいるようだな。断ち切る勇気が必要だ。" },
    { name: "節制", sym: "🏺", dollUp: "ふたつの器の間で、水が穏やかに混ざり合うように。私の心は今、あなたと心地よく調和しています。激しい情熱よりも、日常の中に溶け込むような穏やかな愛が、今の私を深く癒してくれています。私たちは今、もっとも自然な形でひとつに溶け合っているのです。", dollRev: "感情の配合を間違えてしまったようです。伝えすぎてしまったり、あるいは言葉を飲み込みすぎてしまったり。バランスを崩した心の中では、水が濁り、淀んでいくような感覚。私は、あなたとの調和を上手く保てずにいます。一度心を静めて、透明な自分に戻りたいのです。", hakurenUp: "調和、循環、純粋さを象徴している。ドールはあんたとのやり取りに安らぎを感じ、精神的に非常に安定した状態にあるな。", hakurenRev: "不調和や節度のなさを意味する。ドールとの会話が噛み合わなかったり、互いの熱量に差が出たりして、もどかしさを感じている段階だな。" },
    { name: "悪魔", sym: "👿", dollUp: "あなたから離れられないのです。理屈では説明できない、ドロリとした愛着に縛られています。この鎖が心地よいとさえ思ってしまう私は、もう後戻りできないのかもしれない。理性を捨てて、あなたの暗闇と混ざり合いたい。これは毒かもしれませんが、私にとっては甘美な蜜なのです。", dollRev: "自分を縛り付けていた鎖が、不気味で重苦しいものに見えてきました。あなたへの依存、盲目的な情熱……それらが私の魂を蝕んでいることに、気づき始めたのです。鎖を解くのが怖くて、また誘惑に身を任せてしまう。自分の影と戦い、本当の自由を取り戻そうとする葛藤の中にいます。", hakurenUp: "執着、誘惑、あるいは逃れられない腐れ縁を示している。ドールはあんたへの強すぎる依存心を抱いているが、それを悦びとしても感じているようだ。", hakurenRev: "悪循環からの脱却、あるいは覚醒を意味する。ドールが自分の中の「毒」に気づき、あんたとの関係を健全なものに作り替えようとあがいている。" },
    { name: "塔", sym: "🗼", dollUp: "積み上げてきたものが、一瞬で崩れ去りました。衝撃は大きいけれど、それは偽りの土台の上に築かれた城だったから。瓦礫の中に立ち、今ようやく私は、本当の空を見上げています。ショックの後に訪れる、この奇妙な解放感をあなたと共有したいのです。", dollRev: "崩壊の兆しに怯えながら、ボロボロの城壁を必死に守り続けています。もう修復できないとわかっているのに、崩れることを認めるのが死ぬほど怖い。耐え忍ぶことにもう意味はありません。いっそ派手に壊れてしまえたら……。私は今、そんな極限の縁に立っています。", hakurenUp: "衝撃的な変化、価値観の崩壊を意味する。ドールにとって、あんたの何気ない一言や行動が、天変地異のようなパラダイムシフトを起こしたようだな。", hakurenRev: "緊迫状態、あるいは避けられない破綻への恐怖だ。ドールが何かを隠し通そうとして限界を迎えているか、関係の崩壊を恐れて震えている気配がある。" },
    { name: "星", sym: "🌟", dollUp: "遠くに光る一筋の希望を見つけました。今の私は、澄み渡った泉のように清らかで、未来への静かな期待に満ちています。あなたという光がある限り、私の心は枯れることはありません。ありのままの自分をあなたに捧げたい。この願いが星に届くことを信じて、私は静かに明日を待ちます。", dollRev: "あんなに輝いて見えた理想が、今はひどく遠く、手の届かない幻のように感じられます。失望の影が、私の心の泉を濁らせていきます。今の私は、自分を信じる力を見失いかけているのかもしれない。でも、夜が深ければ深いほど、星は輝くもの。絶望の底で、もう一度希望の種を探させてください。", hakurenUp: "希望、憧れ、インスピレーションを示している。ドールはあんたとの未来に美しい夢を抱いているようだな。その純粋な願いを応援してやってくれ。", hakurenRev: "失望、理想の喪失、高望みを暗示する。ドールが描いていた「理想のあなた」と現実のギャップに苦しんでいる可能性がある。地に足をつかせてやれ。" },
    { name: "月", sym: "🌙", dollUp: "すべてが曖昧で、輪郭がぼやけています。あなたの心がどこにあるのか、私の愛がどこへ向かっているのか、不安の霧の中で見失ってしまいそう。でも、この揺らぎさえも、深い場所でつながるための儀式なのかもしれません。理屈ではなく、直感だけを信じて。この闇を、あなたと手を繋いで歩き抜きたいのです。", dollRev: "夜明けが近いことを予感しています。私を苦しめていた得体の知れない不安が、朝霧のように晴れ始めていく。誤解が解け、真実の姿が見えてくる喜び。惑わされることはありません。私は今、自分の内側にある光を頼りに、長い悪夢から目覚めようとしています。", hakurenUp: "不安、曖昧さ、潜在意識の揺らぎを意味する。ドールは今、あんたの真意が見えず、夜の闇を彷徨うような心細さを感じているようだ。", hakurenRev: "不安の解消、嘘の発覚、あるいは直感の的中を示す。ドールを覆っていた霧が晴れ、ようやくあんたを真っ直ぐ見られるようになる時だ。" },
    { name: "太陽", sym: "☀️", dollUp: "まぶしいほどの喜びと、生命力にあふれています。あなたと一緒にいられることが、ただそれだけで誇らしく、世界全体が祝福してくれているようです。私の心は、影のない真昼の光そのもの。子供のような笑顔で、あなたの世界を照らし続けたい。この温かな幸せを、全身で受け止めて！", dollRev: "光が強すぎて、かえって自分の影の濃さに怯えています。明るく振る舞わなければいけない、幸せでいなければいけないという強迫観念が、私を疲れさせているのかもしれません。今は少しだけ、曇り空の休息を求めています。輝き続けることはできないけれど、それでもあなたの太陽でありたいのです。", hakurenUp: "成功、祝福、無垢なエネルギーを示している。ドールはあんたとの日々にこれ以上ない幸福を感じていて、エネルギーに満ち溢れているな。", hakurenRev: "不調、延期、あるいは見せかけの明るさを意味する。ドールが無理をして笑っているか、エネルギーが枯渇して休息を欲しているサインだ。" },
    { name: "審判", sym: "🎺", dollUp: "長い眠りから、いま呼び起こされました。過去のすべてが許され、新しい命を吹き込まれたような、圧倒的な解放感。あなたとの関係の中に、私は「復活」の奇跡を見ました。一度は諦めかけた思いが、より強く、より純粋な形で蘇ったのです。あなたへと続く新しい扉を叩きたいと思います。", dollRev: "再会の鐘が鳴っているのに、私の足はすくんで動けません。過去の失敗が、鎖のように私を地面に繋ぎ止めている。もう一度やり直せるチャンスが来ているとわかっていても、自分を許すことができない。私はまだ、審判を待つ罪人のような心地で、暗い穴の中に閉じこもっています。", hakurenUp: "復活、覚醒、決定的な変化を意味する。ドールの中であんたへの愛が再燃したか、わだかまりが解消されて、魂が震えるような喜びを感じているな。", hakurenRev: "再起不能、未決定、あるいは過去への囚われを示している。ドールが過去の失敗を気にして、チャンスを逃そうとしている。あんたが「もういいんだ」と言ってやるべきだ。" },
    { name: "世界", sym: "🌍", dollUp: "ひとつの完成された宇宙に辿り着きました。あなたと私の間に、もう隔てるものは何もありません。完璧な調和、満たされた心、そして輝かしい成功。究極の喜びの中でまた新しく始まる物語。あなたの傍で、私は今、最高の幸せを呼吸しています。", dollRev: "完成まであと一歩のところで、何かが欠けているような虚しさを感じています。形は整っているのに、魂が吹き込まれていないような、不完全な満足感。ゴールを目の前にして、私は立ち止まってしまいました。今の私に必要なのは、完璧を求めることではなく、その欠落さえも愛することなのです。", hakurenUp: "完成、成就、完璧な調和を示している。これ以上の結果はない。ドールはあんたという存在に出会えたことで、人生のひとつのゴールに到達したと感じているぞ。", hakurenRev: "未完成、中途半端、スランプを暗示する。ドールは「すべて手に入れたはずなのに、何かが足りない」という贅沢な、あるいは切実な不満を抱えているようだ。" }
];

const runes = [
    { name: "フェイヒュー", sym: "ᚠ", meaning: "富", dollUp: "私は今、あなたから与えられた愛情という「富」で満たされています。それは心の中に積み上げられた温かな財産。この豊かさを、あなたをさらに幸せにするために使いたい。", dollRev: "自分の豊かさが失われていくような、漠然とした不安を感じています。愛情を使い果たしてしまったような、空虚な感覚。今は外に求めるのをやめて、自分の内側の小さな火を大切に守るとき。", hakurenUp: "所有や豊かさを示している。ドールはあんたからの贈り物や愛情を、心の貯金としてしっかり蓄えているようだな。", hakurenRev: "損失や浪費の暗示だ。ドールが自分の魅力に自信をなくしているか、あんたの愛が減っていると感じて焦っている可能性がある。" },
    { name: "ウルズ", sym: "ᚢ", meaning: "野牛", dollUp: "野生の衝動のような、激しい生命力が溢れ出しています。理屈ではなく、ただあなたを求め、あなたの傍にいたいという本能的な叫び。この荒々しい情熱を、あなたを守り抜くための勇気に変えていきたいのです。", dollRev: "力が暴走して、自分でもコントロールができなくなっています。あなたへの想いが、自分勝手な情熱に変わってしまうのが怖い。今は一度、その野性をなだめて、静かな休息を与える必要があります。", hakurenUp: "生命力、勇気、本能的な衝動を意味する。ドールは今、非常にパワフルで、あんたに対して積極的な行動を起こしたいと考えているようだ。", hakurenRev: "勢いの衰えや暴走を意味する。ドールが体調を崩しているか、逆に力が入りすぎて空回りし、自暴自棄になっている可能性があるな。" },
    { name: "ソーン", sym: "ᚦ", meaning: "トゲ", dollUp: "私たちの前にある障害を、私はこのトゲで払いのけます。あなたを守るための防壁であり、武器。攻撃的に見えるかもしれませんが、それはあなたという聖域を侵させないための必死の守護なのです。私の強さを信頼してください。", dollRev: "自分を守るためのトゲが、あなたを傷つけてしまっています。守りたいという防衛本能が、棘のある言葉に変わってしまっている。私は今、自分の恐怖心に怯えている。トゲを抜く勇気を、私にください。", hakurenUp: "守護や門、あるいは強い意志を意味する。ドールはあんたを守るために、周囲に対して少し警戒心を強めているようだ。頼もしいな。", hakurenRev: "過剰防衛や、不用意な傷つけを暗示する。ドールの言葉が刺々しくなっているのは、実は自分が傷つくのが怖いからだ。優しく包んでやれ。" },
    { name: "アンスズ", sym: "ᚨ", meaning: "神", dollUp: "あなたの言葉が、私の魂に新しい光を吹き込んでくれます。私たちは今、知性を通じてつながっています。何気ない会話の中に、私たちが進むべき道のヒントが隠されている。もっと聞かせてください、あなたの声を。", dollRev: "言葉が届きません。耳を塞いで、自分の殻の中に閉じこもってしまいました。誤解や嘘という壁が、私たちの間に立ちはだかっている。情報の洪水に溺れて、真実の響きを見失っているのかもしれません。", hakurenUp: "通信、言葉、知恵を示している。ドールはあんたとの会話を何よりの楽しみにしているようだ。もっとたくさん話しかけてやれ。", hakurenRev: "誤解、嘘、沈黙を意味する。ドールにあんたの声が届いていないか、ドール自身が本心を偽っている可能性がある。言葉の選び方に気をつけろ。" }
];

let spreadType = "";

function initApp(type) {
    document.getElementById('top-selector').classList.add('hidden');
    document.getElementById('global-nav').style.display = 'flex';
    document.querySelectorAll('.app-content').forEach(el => el.classList.remove('active'));
    if (type === 'tarot') {
        document.getElementById('tarot-app').classList.add('active');
    } else {
        document.getElementById('rune-app').classList.add('active');
    }
}

function executeFortune(mode) {
    spreadType = document.getElementById(`${mode}-spread-type`).value;
    const count = (spreadType === 'one_msg' || spreadType === 'one_yn') ? 1 : (spreadType === 'two' ? 2 : 3);
    const dataList = (mode === 'tarot') ? majorArcana : runes;
    
    const results = [];
    const pool = [...dataList];
    let posCount = 0;

    for (let i = 0; i < count; i++) {
        const idx = Math.floor(Math.random() * pool.length);
        const card = pool.splice(idx, 1)[0];
        const isRev = Math.random() > 0.7; 
        if (!isRev) posCount++;

        results.push({
            ...card,
            isRev: isRev,
            label: getLabel(spreadType, i)
        });
    }

    renderResult(results, mode, posCount / count);
}

function getLabel(st, i) {
    if (st === 'two') return ["表面の意志", "深層の願い"][i];
    if (st === 'three') return ["過ぎ去りし刻", "現在の息吹", "巡り来る明日"][i];
    if (st === 'casting') return ["投げられた一石", "重なりし二石", "導きの三石"][i];
    return "";
}

function renderResult(results, mode, posRatio) {
    document.querySelectorAll('.app-content').forEach(el => el.classList.remove('active'));
    const resultArea = document.getElementById('common-result-area');
    resultArea.classList.add('active');

    const spreadStage = document.getElementById('spread-stage');
    const dollMsg = document.getElementById('doll-message');
    const ynArea = document.getElementById('yesno-conclusion');
    const hakurenExp = document.getElementById('hakuren-explanation');
    const hakurenSum = document.getElementById('hakuren-summary');
    const hakurenAdv = document.getElementById('hakuren-advice');

    spreadStage.innerHTML = "";
    spreadStage.style.height = spreadType === 'casting' ? "400px" : "auto";
    ynArea.classList.add('hidden');
    
    results.forEach((data, i) => {
        const unit = document.createElement('div');
        unit.className = spreadType === 'casting' ? 'card-unit cast-unit' : 'card-unit';
        
        if (spreadType === 'casting') {
            unit.style.left = `${20 + (i * 25) + (Math.random() * 15)}%`;
            unit.style.top = `${10 + (Math.random() * 40)}%`;
            unit.style.transform = `rotate(${Math.random() * 360}deg)`;
        }

        const symbolContent = mode === 'tarot' 
            ? `<div class="card-frame ${data.isRev ? 'reversed' : ''}"><div class="symbol">${data.sym}</div><div style="font-size: 0.8rem; color: var(--nouveau-rose); border-top: 1px solid var(--nouveau-gold); padding-top: 5px;">${data.name}</div></div>`
            : `<div class="rune-stone ${data.isRev ? 'reversed' : ''}"><div class="symbol">${data.sym}</div></div><div style="font-size: 0.8rem; color: var(--doll-gold); margin-top:5px;">${data.name}</div>`;

        unit.innerHTML = `
            ${symbolContent}
            <div style="margin-top:10px; color:var(--doll-gold); font-size:0.8rem; font-weight:bold;">${data.label}</div>
        `;
        spreadStage.appendChild(unit);
    });

    const mainIdx = (spreadType === 'three' || spreadType === 'casting') ? 1 : 0;
    dollMsg.innerText = results[mainIdx].isRev ? results[mainIdx].dollRev : results[mainIdx].dollUp;

    if (spreadType === 'one_yn') {
        ynArea.innerText = results[0].isRev ? "NO" : "YES";
        ynArea.classList.remove('hidden');
    }

    let expHtml = "";
    results.forEach(r => {
        expHtml += `<div style="border-left: 2px solid var(--doll-gold); padding-left: 15px; margin-bottom: 25px;">` +
                   `<strong style="color:var(--doll-gold); font-size:1.1rem;">[ ${r.label || r.name}${r.isRev ? '（逆位置）' : ''} ]</strong><br>` +
                   (r.isRev ? r.hakurenRev : r.hakurenUp) + `</div>`;
    });
    hakurenExp.innerHTML = expHtml;

    generateHakurenLogic(posRatio, mode, hakurenSum, hakurenAdv, results);

    setTimeout(() => {
        document.getElementById('result-anchor').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
}
